[project]
name = "deltaid"
version = "0.1.0"
description = "Semantic-segmentation models and adapters for the Marainer training framework."
authors = [{name = "Taidal"}]
license = {text = "MIT"}
dependencies = [
    "marainer>=0.1.0",
    "confluid>=0.1.0",
    "data-flux>=0.1.0",
    "log-flow>=0.1.0",
    "torch",
    "torchvision",
    "torchmetrics",
    "pytorch-lightning",
    "segmentation-models-pytorch>=0.3.4",
]
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "black>=24.0.0,<25.0.0",
    "isort>=5.13.0,<6.0.0",
    "flake8>=6.0.0,<8.0.0",
    "mypy>=1.0.0,<2.0.0",
    "pytest>=7.0.0,<9.0.0",
    "pytest-cov>=4.0.0,<7.0.0",
]

[project.scripts]
deltaid = "deltaid.cli:main"

[project.entry-points."marainer.commands"]
deltaid = "deltaid.plugin:register"

[project.entry-points."confluid.configurables"]
deltaid = "deltaid"

[tool.setuptools.packages.find]
where = ["."]
include = ["deltaid*"]

[tool.setuptools.package-data]
deltaid = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["deltaid"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.isort]
profile = "black"
line_length = 120

[tool.black]
line-length = 120

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203"]

[tool.mypy]
disable_error_code = ["import-untyped"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
strict_optional = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "torchvision.*",
    "torchmetrics.*",
    "pytorch_lightning.*",
    "segmentation_models_pytorch.*",
]
ignore_missing_imports = true
