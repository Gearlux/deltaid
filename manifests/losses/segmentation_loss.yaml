description: "Segmentation loss: CrossEntropy + optional Dice term + class weights."
use_case: "Default segmentation loss. CE alone works well; add a Dice term (dice_weight > 0) when foreground classes are tiny relative to background. class_weights rebalances skewed pixel distributions."
category: "Segmentation"
flux_type: "Loss"
task: "semantic_segmentation"
class_path: "deltaid.segmentation.SegmentationLoss"
params:
  dice_weight:
    type: "float"
    default: 0.0
    description: "Weight for the Dice term (0 = pure CE; 0.5 is a reasonable mix for tiny foreground classes)."
  class_weights:
    type: "List[float] | null"
    default: null
    description: "Optional per-class CE weights (length = num_classes)."
  ignore_index:
    type: "int"
    default: -100
    description: "Pixel value to ignore (e.g. unlabeled regions)."
