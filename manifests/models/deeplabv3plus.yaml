description: "DeepLabV3+ semantic-segmentation model wrapped for the Marainer Trainer flow."
use_case: "Default segmentation model. Forward returns raw logits — pair with SegmentationLoss (CE + optional Dice) and torchmetrics.classification.MulticlassJaccardIndex / Dice for val. Strong on small datasets when ImageNet-pretrained encoder is paired with a fresh decoder."
category: "Segmentation"
flux_type: "Model"
task: "semantic_segmentation"
class_path: "deltaid.deeplabv3plus.DeepLabV3PlusModel"
params:
  num_classes:
    type: "int"
    required: true
    description: "Output channel count INCLUDING background as class 0. For binary foreground/background, pass 2."
  encoder_name:
    type: "str"
    default: "resnet34"
    description: "smp encoder identifier (resnet34 / resnet50 / efficientnet-b0 / mit_b0 / mobilenet_v2 / ...). See https://smp.readthedocs.io/."
  encoder_weights:
    type: "str | null"
    default: "imagenet"
    description: "Pretrained-weights tag (imagenet / null). null initializes from scratch."
  in_channels:
    type: "int"
    default: 3
    description: "Input channel count. 3 for RGB / rendered spectrograms; 1 for grayscale."
  decoder_channels:
    type: "int"
    default: 256
    description: "Width of the decoder convolutions."
  decoder_atrous_rates:
    type: "Tuple[int, int, int]"
    default: [12, 24, 36]
    description: "Dilation rates for the ASPP module."
  activation:
    type: "str | null"
    default: null
    description: "Final activation. null = raw logits (preferred for CE loss)."
  checkpoint_path:
    type: "str | null"
    default: null
    description: "Optional Lightning .ckpt path."
  checkpoint_strict:
    type: "bool"
    default: false
    description: "Forwarded to load_state_dict(strict=...)."
